            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .accordion-header:hover {
            border-color: #38bdf8;
            background: #253348;
        }
        .accordion-header .arrow {
            font-size: 0.75rem;
            transition: transform 0.3s;
        }
        .accordion-header.active .arrow {
            transform: rotate(180deg);
        }

        /* محتوى القسم والفقاعات */
        .accordion-content {
            display: none;
            background: #111827;
            border: 1px solid #334155;
            border-top: none;
            border-radius: 0 0 8px 8px;
            padding: 12px;
            margin-top: -8px;
            margin-bottom: 12px;
        }
        .bubbles-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .bubble-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.8rem;

        }

                    {ar: 'كاسة فواكة بالشوكلاتة', en: 'Fruit Cup with Chocolate', price: '3.00'},
                    {ar: 'كاسة فراوله وموز بالنوتيلا', en: 'Strawberry & Banana Cup with Nutella', price: '2.50'},
                    {ar: 'صحن قشطة وعسل ومكسرات', en: 'Cream, Honey & Nuts Plate', price: '2.75'}
                ]
            },
            {
                titleAr: 'الإضافات', titleEn: 'Add-ons', icon: '✨',
                items: [
                    {ar: 'قشطة', en: 'Cream', price: '0.75'},
                    {ar: 'عسل', en: 'Honey', price: '0.50'},
                    {ar: 'مكسرات', en: 'Nuts', price: '0.50'},
                    {ar: 'صوص شوكلت', en: 'Chocolate Sauce', price: '0.50'},
                    {ar: 'صوص بستاشيو', en: 'Pistachio Sauce', price: '0.75'},
                    {ar: 'فواكة', en: 'Fruits', price: '1.00'},
                    {ar: 'ايس كريم', en: 'Ice Cream', price: '1.25'}
                ]
            }
        ];

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            menuData.forEach((section, index) => {
                let title = currentLang === 'ar' ? section.titleAr : section.titleEn;
                let bubblesHTML = '';

                section.items.forEach(item => {
                    let itemName = currentLang === 'ar' ? item.ar : item.en;
                    bubblesHTML += `
                        <div class="bubble-item">
                            <span class="bubble-name">${itemName}</span>
                            <span class="bubble-price">${item.price}</span>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div>
                        <div class="accordion-header" onclick="toggleAccordion(${index})">
                            <span>${section.icon} ${title}</span>
                            <span class="arrow" id="arrow-${index}">▼</span>
                        </div>
                        <div class="accordion-content" id="content-${index}">
                            <div class="bubbles-container">
                                ${bubblesHTML}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleAccordion(index) {
            const content = document.getElementById(`content-${index}`);
            const arrow = document.getElementById(`arrow-${index}`);
            const header = content.previousElementSibling;

            if (content.style.display === 'block') {
                content.style.display = 'none';
                header.classList.remove('active');
            } else {
                content.style.display = 'block';
                header.classList.add('active');
            }
        }

        function toggleWhatsappMenu() {
            const menu = document.getElementById('whatsappMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // إغلاق قائمة الواتساب عند النقر خارجها
        window.onclick = function(event) {
            if (!event.target.closest('.whatsapp-dropdown-container')) {
                document.getElementById('whatsappMenu').style.display = 'none';
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const htmlRoot = document.getElementById('html-root');
            const langBtn = document.getElementById('langBtn');

            if (currentLang === 'en') {
                htmlRoot.setAttribute('dir', 'ltr');
                htmlRoot.setAttribute('lang', 'en');
                langBtn.textContent = 'عربي 🌐';
                document.getElementById('main-title').innerHTML = 'CLOUDS CAFÉ <span>Menu</span>';
                document.getElementById('sub-title').textContent = 'COFFEE • FOOD • SPORTS • GOOD VIBES';
                document.getElementById('footer-heading').textContent = 'Good Coffee. Better Moments.';
                document.getElementById('footer-address').innerHTML = '📍 <strong>Address:</strong> Mafraq - Opposite to Works & Health Directorate';
                document.getElementById('wa-btn-text').textContent = 'WhatsApp Contact';
                document.getElementById('footer-note').textContent = 'See you at Clouds ☁';
            } else {
                htmlRoot.setAttribute('dir', 'rtl');
                htmlRoot.setAttribute('lang', 'ar');
                langBtn.textContent = 'English 🌐';
                document.getElementById('main-title').innerHTML = 'CLOUDS CAFÉ <span>غيوم كافية</span>';
                document.getElementById('sub-title').textContent = 'COFFEE • FOOD • SPORTS • GOOD VIBES';
                document.getElementById('footer-heading').textContent = 'Good Coffee. Better Moments.';
                document.getElementById('footer-address').innerHTML = '📍 <strong>العنوان:</strong> المفرق - مقابل مديرية الأشغال ومديرية الصحة';
                document.getElementById('wa-btn-text').textContent = 'تواصل عبر الواتساب';
                document.getElementById('footer-note').textContent = 'See you at Clouds ☁';
            }

            renderMenu();
        }

        renderMenu();
    </script>
</body>
</html>
