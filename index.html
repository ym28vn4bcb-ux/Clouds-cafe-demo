<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clouds Café - غيوم كافية</title>
    <!-- استيراد خطوط Google Fonts: Poppins للوجو والبايو -->
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: 'Amiri', serif;
        }
        header {
            background: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.8)), url('DA1E1176-82A6-4C9A-BAA5-28F9E0AEA963.png') center/cover;
            padding: 90px 20px;
            text-align: center;
            border-bottom: 2px solid #334155;
            position: relative;
        }
        .lang-switch {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
        }
        .lang-switch:hover {
            background: #38bdf8;
            color: #0f172a;
        }
        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 2px;
            /* خط بوبل عريض + ظل أسود عميق + إضاءة متوهجة */
            font-family: 'Poppins', sans-serif;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.95), 
                         0 0 18px rgba(56, 189, 248, 0.8), 
                         0 0 35px rgba(56, 189, 248, 0.5);
        }
        header h1 span {
            color: #f8fafc;
            font-weight: 600;
            display: block;
            font-size: 1.1rem;
            letter-spacing: 3px;
            font-family: 'Amiri', serif;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            margin-top: 5px;
        }
        header p {
            color: #94a3b8; /* لون هادئ وغير لافت ليكون البايو غير مهيمن وسلس */
            font-size: 0.85rem; /* حجم صغير ومرتب أصغر بكثير من اللوجو */
            margin-top: 10px;
            font-weight: 400; /* خط رسمي وناعم */
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* حاوية أزرار الغيوم */
        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 15px;
            text-align: center;
        }
        .clouds-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        
        /* تصميم زر الغيمة للأقسام */
        .cloud-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            font-family: 'Amiri', serif;
        }
        .cloud-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-3px);
            border-color: #38bdf8;
            box-shadow: 0 6px 15px rgba(56, 189, 248, 0.3);
        }

        /* نافذة الإشعار العائمة في المنتصف */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.55)), url('9A2E03A5-6565-45B0-8496-5D82CACCA9AF.png') center/cover;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            animation: popUp 0.3s ease;
            position: relative;
            padding: 25px;
        }
        @keyframes popUp {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed rgba(56, 189, 248, 0.5);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .modal-title {
            font-size: 1.4rem;
            color: #38bdf8;
            font-weight: 700;
            font-family: 'Reem Kufi', sans-serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        .close-btn {
            background: rgba(15, 23, 42, 0.8);
            color: #94a3b8;
            border: 1px solid #334155;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        .close-btn:hover {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }

        /* قائمة الأصناف بخلفية أفتح لتبرز صورة القهوة بشكل ممتاز خلفها */
        .modal-items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-item-row {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }
        .modal-item-row:hover {
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.6);
        }
        .modal-item-name {
            font-size: 1.15rem;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .modal-item-price {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 700;
            background: rgba(15, 23, 42, 0.75);
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-family: 'Poppins', sans-serif;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Footer & Social Icons */
        footer {
            text-align: center;
            padding: 35px 20px;
            background: #090d16;
            color: #94a3b8;
            border-top: 1px solid #1e293b;
            margin-top: 30px;
        }
        footer h2 {
            color: #f8fafc;
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: 700;
            font-family: 'Reem Kufi', sans-serif;
        }
        .contact-info {
            margin: 10px 0;
            font-size: 0.95rem;
        }
        
        /* أزرار التواصل الدائرية متجاورة */
        .social-circles {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 15px 0 10px 0;
        }
        .social-circle-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.2rem;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s, opacity 0.2s;
        }
        .social-circle-btn:hover {
            transform: scale(1.1);
            opacity: 0.9;
        }
        .circle-whatsapp { background-color: #25D366; }
        .circle-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .circle-facebook { background-color: #1877F2; }
    </style>
</head>
<body>

    <header>
        <button class="lang-switch" onclick="toggleLanguage()" id="langBtn">English 🌐</button>
        <h1 id="main-title">CLOUDS CAFÉ <span>غيوم كافية</span></h1>
        <p id="sub-title">COFFEE • FOOD • SPORTS • GOOD VIBES</p>
    </header>

    <div class="container">
        <div class="clouds-grid" id="cloudsGrid">
            <!-- غيوم الأقسام -->
        </div>
    </div>

    <!-- النافذة العائمة مع صورة القهوة الباهتة خلف القائمة -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">اسم القسم</h3>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-items-list" id="modalItemsList">
                <!-- الأصناف -->
            </div>
        </div>
    </div>

    <footer>
        <h2 id="footer-heading">Good Coffee. Better Moments.</h2>
        <div class="contact-info">
            <p id="footer-address">📍 <strong>العنوان:</strong> المفرق - مقابل مديرية الأشغال ومديرية الصحة</p>
            <p id="footer-phones" style="margin-top: 5px;">📞 <strong>الهواتف:</strong> 026235772 | 0777778270 | 0771999044</p>
        </div>

        <div class="social-circles">
            <a href="https://wa.me/962777778270" target="_blank" class="social-circle-btn circle-whatsapp" title="WhatsApp">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="https://www.instagram.com/clouds_coffee1?stkn=MTlveHRsNXY0Znd4aw==" target="_blank" class="social-circle-btn circle-instagram" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.facebook.com/share/1F3SoewJ2h/?mibextid=wwXIfr" target="_blank" class="social-circle-btn circle-facebook" title="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
        </div>

        <p style="margin-top: 10px; font-size: 0.8rem;" id="footer-note">See you at Clouds ☁</p>
    </footer>

    <script>
        let currentLang = 'ar';

        const menuData = [
            {
                titleAr: 'الأراغيل', titleEn: 'Shisha', icon: '☁',
                
            }
        ];

        function renderClouds() {
            const grid = document.getElementById('cloudsGrid');
            grid.innerHTML = '';

            menuData.forEach((section, index) => {
                let title = currentLang === 'ar' ? section.titleAr : section.titleEn;
                grid.innerHTML += `
                    <button class="cloud-btn" onclick="openModal(${index})">
                        <span>${section.icon}</span> ${title}
                    </button>
                `;
            });
        }

        function openModal(index) {
            const section = menuData[index];
            let title = currentLang === 'ar' ? section.titleAr : section.titleEn;
            
            document.getElementById('modalTitle').innerHTML = `${section.icon} ${title}`;
            
            const listContainer = document.getElementById('modalItemsList');
            listContainer.innerHTML = '';

            section.items.forEach(item => {
                let itemName = currentLang === 'ar' ? item.ar : item.en;
                listContainer.innerHTML += `
                    <div class="modal-item-row">
                        <span class="modal-item-name">${itemName}</span>
                        <span class="modal-item-price">${item.price}</span>
                    </div>
                `;
            });

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        window.onclick = function(event) {
            const overlay = document.getElementById('modalOverlay');
            if (event.target === overlay) {
                closeModal();
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const htmlRoot = document.getElementById('html-root');
            const langBtn = document.getElementById('langBtn');

            if (currentLang === 'en') {
                htmlRoot.setAttribute('dir', 'ltr');
                htmlRoot.setAttribute('lang', 'en');
                langBtn.textContent = 'عربي 🌐';
                document.getElementById('main-title').innerHTML = 'CLOUDS CAFÉ <span>Menu</span>';
                document.getElementById('sub-title').textContent = 'COFFEE • FOOD • SPORTS • GOOD VIBES';
                document.getElementById('footer-heading').textContent = 'Good Coffee. Better Moments.';
                document.getElementById('footer-address').innerHTML = '📍 <strong>Address:</strong> Mafraq - Opposite to Works & Health Directorate';
                document.getElementById('footer-phones').innerHTML = '📞 <strong>Phones:</strong> 026235772 | 0777778270 | 0771999044';
                document.getElementById('footer-note').textContent = 'See you at Clouds ☁';
            } else {
                htmlRoot.setAttribute('dir', 'rtl');
                htmlRoot.setAttribute('lang', 'ar');
                langBtn.textContent = 'English 🌐';
                document.getElementById('main-title').innerHTML = 'CLOUDS CAFÉ <span>غيوم كافية</span>';
                document.getElementById('sub-title').textContent = 'COFFEE • FOOD • SPORTS • GOOD VIBES';
                document.getElementById('footer-heading').textContent = 'Good Coffee. Better Moments.';
                document.getElementById('footer-address').innerHTML = '📍 <strong>العنوان:</strong> المفرق - مقابل مديرية الأشغال ومديرية الصحة';
                document.getElementById('footer-phones').innerHTML = '📞 <strong>الهواتف:</strong> 026235772 | 0777778270 | 0771999044';
                document.getElementById('footer-note').textContent = 'See you at Clouds ☁';
            }

            renderClouds();
        }

        renderClouds();
    </script>
</body>
</html>
