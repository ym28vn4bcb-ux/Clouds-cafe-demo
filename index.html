        * {

            box-sizing: border-box;

        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1200&q=80') center/cover;
            padding: 50px 20px;
            text-align: center;
            border-bottom: 2px solid #334155;
        }
        header .logo-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: #38bdf8;
        }
        header h1 span {
            color: #f8fafc;
            font-weight: 400;
            display: block;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
        header p {
            color: #94a3b8;
            font-size: 1rem;
            margin-top: 8px;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        /* Home Category Cards View */
        #categories-view h2.main-heading {
            text-align: center;
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .category-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .category-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
            background: #253348;
        }
        .category-card .cat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        .category-card h3 {
            font-size: 1.2rem;
            color: #f8fafc;
            margin-bottom: 5px;
        }
        .category-card span {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* Menu Section View */
        .section-view {
            display: none;
        }
        .back-btn {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }
        .section-title {
            text-align: center;
            margin-bottom: 25px;
            font-size: 2rem;
            color: #38bdf8;
            border-bottom: 2px dashed #334155;
            padding-bottom: 10px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .menu-item {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }
        .item-details h3 {
            font-size: 1.1rem;
            color: #f1f5f9;
            margin-bottom: 3px;
        }
        .item-details .en-name {
            font-size: 0.85rem;
            color: #38bdf8;
            display: block;
            margin-bottom: 3px;
        }
        .item-details p {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .item-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            white-space: nowrap;
        }

        /* Footer & Info */
        footer {
            text-align: center;
            padding: 40px 20px;
            background: #090d16;
            color: #94a3b8;
            margin-top: 50px;
            border-top: 1px solid #1e293b;
        }
        footer h2 {
            color: #f8fafc;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }
        .contact-info {
            margin: 20px 0;
            font-size: 0.95rem;
        }

            margin: 5px 0;
        }
        .social-links {
            display: flex;
            justify-content: center;

            margin: 20px 0;

        .social-btn {
            background: #1e293b;
            color: #38bdf8;
            padding: 10px 20px;
            border-radius: 8px;

            border: 1px solid #334155;
            font-weight: 600;
            transition: all 0.2s;
        }
        .social-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>

                        <div class="cat-icon">${cat.icon}</div>
                        <h3>${cat.titleAr}</h3>
                        <span>${cat.titleEn}</span>
                    </div>
                `;
            });
        }

        function openSection(id) {
            const cat = menuData.find(c => c.id === id);
            if (!cat) return;

            document.getElementById('categories-view').style.display = 'none';
            const sectionView = document.getElementById('section-view');
            sectionView.style.display = 'block';

            let contentHTML = `
                <h2 class="section-title">${cat.icon} ${cat.titleAr} <span style="font-size:1.2rem; color:#94a3b8;">/ ${cat.titleEn}</span></h2>
                <div class="menu-grid">
            `;

            cat.items.forEach(item => {
                contentHTML += `
                    <div class="menu-item">
                        <div class="item-details">
                            <h3>${item.ar}</h3>
                            <span class="en-name">${item.en}</span>
                        </div>
                        <div class="item-price">${item.price}</div>
                    </div>
                `;
            });

            contentHTML += `</div>`;
            document.getElementById('sectionContent').innerHTML = contentHTML;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function showCategories() {
            document.getElementById('section-view').style.display = 'none';
            document.getElementById('categories-view').style.display = 'block';
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // تشغيل عرض الأقسام عند التحميل
        renderCategories();
    </script>
</body>
</html>
